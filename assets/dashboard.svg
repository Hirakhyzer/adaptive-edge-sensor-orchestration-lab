<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Energy quality dashboard">
  <rect width="1200" height="620" rx="30" fill="#F8FBFF"/>
  <text x="70" y="70" font-family="Arial" font-size="38" font-weight="700" fill="#0F172A">Energy-Quality Dashboard</text>
  <text x="70" y="105" font-family="Arial" font-size="18" fill="#475569">Illustrative research dashboard for synthetic edge sensing experiments.</text>
  <g font-family="Arial">
    <rect x="70" y="150" width="245" height="120" rx="22" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="100" y="195" font-size="18" font-weight="700" fill="#475569">Energy Saving</text><text x="100" y="240" font-size="42" font-weight="700" fill="#2563EB">42%</text>
    <rect x="345" y="150" width="245" height="120" rx="22" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="375" y="195" font-size="18" font-weight="700" fill="#475569">Quality Score</text><text x="375" y="240" font-size="42" font-weight="700" fill="#10B981">0.88</text>
    <rect x="620" y="150" width="245" height="120" rx="22" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="650" y="195" font-size="18" font-weight="700" fill="#475569">Latency Risk</text><text x="650" y="240" font-size="42" font-weight="700" fill="#7C3AED">Low</text>
    <rect x="895" y="150" width="235" height="120" rx="22" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
    <text x="925" y="195" font-size="18" font-weight="700" fill="#475569">Balance</text><text x="925" y="240" font-size="42" font-weight="700" fill="#F97316">0.74</text>
    <rect x="70" y="320" width="620" height="220" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="100" y="360" font-size="22" font-weight="700" fill="#0F172A">Energy vs Quality Trend</text>
    <polyline points="120,490 210,455 300,432 390,420 480,402 570,382 650,360" fill="none" stroke="#10B981" stroke-width="5"/>
    <polyline points="120,390 210,398 300,410 390,420 480,438 570,466 650,500" fill="none" stroke="#2563EB" stroke-width="5"/>
    <rect x="730" y="320" width="400" height="220" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="760" y="360" font-size="22" font-weight="700" fill="#0F172A">Policy Comparison</text>
    <rect x="780" y="405" width="230" height="20" rx="10" fill="#DBEAFE"/><rect x="780" y="405" width="180" height="20" rx="10" fill="#2563EB"/>
    <rect x="780" y="455" width="230" height="20" rx="10" fill="#CCFBF1"/><rect x="780" y="455" width="205" height="20" rx="10" fill="#06B6D4"/>
    <rect x="780" y="505" width="230" height="20" rx="10" fill="#DCFCE7"/><rect x="780" y="505" width="155" height="20" rx="10" fill="#10B981"/>
  </g>
</svg>