    <rect x="34" y="100" width="142" height="12" rx="6" fill="#D7E6F5"/><rect x="34" y="100" width="96" height="12" rx="6" fill="#06B6D4"/>
    <rect x="34" y="130" width="142" height="12" rx="6" fill="#D7E6F5"/><rect x="34" y="130" width="72" height="12" rx="6" fill="#F59E0B"/>
