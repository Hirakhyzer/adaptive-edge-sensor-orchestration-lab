<svg width="1400" height="460" viewBox="0 0 1400 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Edge Sensor Orchestration Lab banner</title>
  <desc id="desc">Light academic banner showing adaptive edge sensing, sensor groups, energy quality trade-offs, and smart-city analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="460"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="0.5" stop-color="#06B6D4"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1400" height="460" rx="34" fill="url(#bg)"/>
  <circle cx="1190" cy="80" r="250" fill="#DBEAFE" opacity="0.50"/>
  <circle cx="120" cy="390" r="210" fill="#CCFBF1" opacity="0.55"/>
  <path d="M0 395C180 338 332 420 514 375C690 332 827 398 1002 354C1165 313 1286 324 1400 280" stroke="#BAE6FD" stroke-width="3" opacity="0.85"/>

