    <g stroke="#60A5FA" stroke-width="3" opacity="0.9">
      <line x1="95" y1="130" x2="175" y2="92"/><line x1="175" y1="92" x2="260" y2="134"/><line x1="95" y1="130" x2="140" y2="222"/><line x1="140" y1="222" x2="260" y2="134"/><line x1="175" y1="92" x2="140" y2="222"/><line x1="260" y1="134" x2="250" y2="230"/>
    </g>
    <g>
      <circle cx="95" cy="130" r="18" fill="#2563EB"/><circle cx="175" cy="92" r="18" fill="#06B6D4"/><circle cx="260" cy="134" r="18" fill="#10B981"/><circle cx="140" cy="222" r="18" fill="#F59E0B"/><circle cx="250" cy="230" r="18" fill="#94A3B8"/>
    </g>
    <rect x="34" y="256" width="126" height="34" rx="17" fill="#E0F2FE"/><text x="56" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0369A1">active</text>
    <rect x="174" y="256" width="150" height="34" rx="17" fill="#DCFCE7"/><text x="198" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#047857">energy aware</text>
  </g>

  <g transform="translate(500 92)">
    <rect x="0" y="0" width="212" height="34" rx="17" fill="#ECFEFF" stroke="#67E8F9"/>
    <text x="22" y="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#0891B2">ACADEMIC AIoT RESEARCH</text>
    <text x="0" y="106" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="900" fill="#0F172A">Adaptive Edge Sensor</text>
    <text x="0" y="169" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="900" fill="#0F172A">Orchestration Lab</text>
    <rect x="0" y="197" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#334155">Dynamic sensor group selection for energy-efficient,</text>
    <text x="0" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#334155">context-aware, and quality-preserving edge sensing.</text>
