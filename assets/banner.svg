      <rect x="210" width="245" height="44" rx="22" fill="#ECFDF5"/><text x="242" y="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">Energy–Quality Trade-off</text>
      <rect x="476" width="215" height="44" rx="22" fill="#EEF2FF"/><text x="508" y="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#4338CA">Smart-City Sensing</text>
